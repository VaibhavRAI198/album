<!-- =====================================================
     BACKGROUND IMAGE SECTION
===================================================== -->

<div class="background-section">

    <div class="settings-header">

        <div class="settings-title">

            <div class="title-icon">
                🖼️
            </div>

            <div class="title-content">

                <div class="title-row">

                    <h2>
                        Background Image
                    </h2>

                    <span class="image-count">
                        {{ background_image|length }} Images
                    </span>

                </div>

                <p>
                    Choose a beautiful background for your dashboard
                </p>

            </div>

        </div>


        <div class="header-actions">

            <button
                type="button"
                class="action-btn minimize-btn"
                id="minimizeButton"
                onclick="toggleImages()"
                aria-expanded="true"
                aria-controls="backgroundGrid"
            >

                <span
                    class="btn-icon"
                    id="toggleIcon"
                >
                    −
                </span>

                <span id="toggleText">
                    Minimize
                </span>

            </button>

        </div>

    </div>


    <div class="section-divider"></div>


    <div
        class="background-grid"
        id="backgroundGrid"
    >

        <!-- ================= ADD IMAGE ================= -->

        <div class="background-card add-background-card">

            <form
                action="{{ url_for('add_background') }}"
                method="POST"
                enctype="multipart/form-data"
                class="upload-form"
                id="uploadForm"
            >

                <label
                    for="backgroundImageInput"
                    class="add-image-area"
                    id="addImageArea"
                >

                    <div class="add-image-icon">
                        ＋
                    </div>

                    <div class="add-image-title">
                        Add Background
                    </div>

                    <div class="add-image-text">
                        JPG, PNG, WEBP or GIF
                    </div>

                </label>


                <input
                    type="file"
                    id="backgroundImageInput"
                    name="background"
                    accept=".jpg,.jpeg,.png,.webp,.gif"
                    hidden
                    onchange="previewSelectedImage(this)"
                >


                <div
                    class="upload-preview"
                    id="uploadPreview"
                >

                    <img
                        id="previewImage"
                        src=""
                        alt="Selected background preview"
                    >

                </div>


                <div class="background-info">

                    <div
                        class="background-name"
                        id="selectedFileName"
                        title="No image selected"
                    >
                        No image selected
                    </div>

                    <button
                        type="submit"
                        class="upload-btn"
                        id="uploadButton"
                        disabled
                    >
                        ⬆️ Add Image
                    </button>

                </div>

            </form>

        </div>


        <!-- ================= EXISTING IMAGES ================= -->

        {% for i in background_image %}

        <div class="background-card">

            <div class="background-preview">

                <img
                    src="{{ url_for(
                        'static',
                        filename='background/' + i
                    ) }}"
                    alt="{{ i }}"
                >

                {% if selected_background == i %}

                <span class="selected-badge">
                    ✓ Selected
                </span>

                {% endif %}

            </div>


            <div class="background-info">

                <div
                    class="background-name"
                    title="{{ i }}"
                >
                    {{ i }}
                </div>


                <div class="background-actions">

                    <form
                        action="{{ url_for('set_background') }}"
                        method="POST"
                    >

                        <input
                            type="hidden"
                            name="background"
                            value="{{ i }}"
                        >

                        <button
                            type="submit"
                            class="set-btn"
                            {% if selected_background == i %}
                            disabled
                            {% endif %}
                        >

                            {% if selected_background == i %}
                                ✓ Selected
                            {% else %}
                                🖼️ Set
                            {% endif %}

                        </button>

                    </form>


                    <form
                        action="{{ url_for('delete_background') }}"
                        method="POST"
                        onsubmit="return confirmDelete(this)"
                    >

                        <input
                            type="hidden"
                            name="background"
                            value="{{ i }}"
                        >

                        <button
                            type="submit"
                            class="delete-btn"
                        >
                            🗑️ Delete
                        </button>

                    </form>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

<style>

    /* =====================================================
   NATIVE TIMEZONE DATALIST
===================================================== */

.timezone-input {

    width: 100%;

    min-height: 40px;

    padding: 8px 12px;

    box-sizing: border-box;

    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    border-radius: 8px;

    outline: none;

    background:
        rgba(255, 255, 255, 0.08);

    color: #ffffff;

    font-size: 12px;

    font-weight: 600;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}


.timezone-input:hover {

    background:
        rgba(255, 255, 255, 0.13);

    border-color:
        rgba(255, 209, 102, 0.35);

}


.timezone-input:focus {

    background:
        rgba(255, 255, 255, 0.13);

    border-color:
        rgba(255, 209, 102, 0.50);

    box-shadow:
        0 0 0 3px
        rgba(255, 209, 102, 0.08);

}


.timezone-input::placeholder {

    color:
        rgba(255, 255, 255, 0.40);

}


/* Chrome / Edge dropdown arrow */

.timezone-input::-webkit-calendar-picker-indicator {

    opacity: 0.7;

    cursor: pointer;

    filter:
        invert(1);
}


/* Firefox */

.timezone-input::-moz-placeholder {

    color:
        rgba(255, 255, 255, 0.40);

}

/* =====================================================
   TIMEZONE SECTION
===================================================== */

.timezone-section {

    width: 100%;

    margin-top: 20px;

    padding: 22px;

    box-sizing: border-box;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 209, 102, 0.08),
            rgba(255, 255, 255, 0.06)
        );

    backdrop-filter: blur(12px);

    border:
        1px solid
        rgba(255, 255, 255, 0.15);

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.15);

}


/* =====================================================
   COMMON HEADER
===================================================== */

.settings-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

}


.settings-title {

    display: flex;

    align-items: center;

    gap: 14px;

}


.title-icon {

    width: 48px;

    height: 48px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    border-radius: 12px;

    font-size: 25px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 209, 102, 0.16),
            rgba(255, 255, 255, 0.08)
        );

    border:
        1px solid
        rgba(255, 209, 102, 0.18);

}


.title-content {

    min-width: 0;

}


.title-row {

    display: flex;

    align-items: center;

    gap: 12px;

}


.title-row h2 {

    margin: 0;

    font-size: 22px;

    font-weight: 700;

    color: #ffffff;

}


.title-content p {

    margin: 5px 0 0;

    font-size: 13px;

    color:
        rgba(255, 255, 255, 0.65);

}


.image-count {

    max-width: 220px;

    padding: 4px 9px;

    border-radius: 20px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 11px;

    font-weight: 600;

    color: #ffffff;

    background:
        rgba(255, 209, 102, 0.12);

    border:
        1px solid

}


.section-divider {

    width: 100%;

    height: 1px;

    margin: 18px 0;

    background:
        rgba(255, 255, 255, 0.12);

}


/* =====================================================
   FORM
===================================================== */

.timezone-form {

    width: 100%;

    margin: 0;

}


/* =====================================================
   TIMEZONE CARD
===================================================== */

.timezone-card-setting {

    position: relative;

    width: 100%;

    height: 90px;

    padding: 14px;

    box-sizing: border-box;

    display: flex;

    align-items: center;

    gap: 14px;

    border-radius: 13px;

    background:
        rgba(0, 0, 0, 0.22);

    border:
        1px solid
        rgba(255, 255, 255, 0.12);

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;

}


.timezone-card-setting:hover {

    border-color:
        rgba(255, 209, 102, 0.28);

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.20);

}


/* =====================================================
   ICON
===================================================== */

.current-timezone-icon {

    width: 44px;

    height: 44px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 209, 102, 0.22),
            rgba(255, 159, 67, 0.12)
        );

    border:
        1px solid
        rgba(255, 209, 102, 0.25);

    font-size: 21px;

}


/* =====================================================
   CONTENT
===================================================== */

.timezone-content {

    flex: 1;

    min-width: 0;

}


.timezone-label {

    display: block;

    margin-bottom: 6px;

    color: #ffffff;

    font-size: 11px;

    font-weight: 600;

}


/* =====================================================
   CUSTOM SELECTOR
===================================================== */

.timezone-selector {

    position: relative;

    width: 100%;

}


.timezone-selected {

    width: 100%;

    min-height: 40px;

    padding: 8px 12px;

    box-sizing: border-box;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    border-radius: 8px;

    background:
        rgba(255, 255, 255, 0.08);

    color: #ffffff;

    cursor: pointer;

    outline: none;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;

}


.timezone-selected:hover,
.timezone-selected:focus {

    background:
        rgba(255, 255, 255, 0.13);

    border-color:
        rgba(255, 209, 102, 0.40);

}


.timezone-selector.open
.timezone-selected {

    border-color:
        rgba(255, 209, 102, 0.50);

    box-shadow:
        0 0 0 3px
        rgba(255, 209, 102, 0.08);

}


.selected-timezone-text {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 12px;

    font-weight: 600;

}


.timezone-arrow {

    flex-shrink: 0;

    color:
        rgba(255, 255, 255, 0.65);

    font-size: 16px;

    transition:
        transform 0.2s ease;

}


.timezone-selector.open
.timezone-arrow {

    transform: rotate(180deg);

}


/* =====================================================
   DROPDOWN
===================================================== */

.timezone-dropdown {

    position: absolute;

    z-index: 9999;

    top: calc(100% + 7px);

    left: 0;

    width: 100%;

    display: none;

    overflow: hidden;

    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    border-radius: 12px;

    background:
        rgba(25, 25, 30, 0.97);

    backdrop-filter: blur(18px);

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.45);

}


.timezone-selector.open
.timezone-dropdown {

    display: block;

}


/* =====================================================
   SEARCH
===================================================== */

.timezone-search-box {

    position: relative;

    padding: 10px;

    border-bottom:
        1px solid
        rgba(255, 255, 255, 0.10);

    background:
        rgba(255, 255, 255, 0.04);

}


.timezone-search-icon {

    position: absolute;

    top: 50%;

    left: 20px;

    transform: translateY(-50%);

    font-size: 13px;

    pointer-events: none;

}


.timezone-search {

    width: 100%;

    min-height: 38px;

    padding: 8px 35px 8px 36px;

    box-sizing: border-box;

    border:
        1px solid
        rgba(255, 255, 255, 0.15);

    border-radius: 8px;

    outline: none;

    background:
        rgba(0, 0, 0, 0.25);

    color: #ffffff;

    font-size: 12px;

}


.timezone-search::placeholder {

    color:
        rgba(255, 255, 255, 0.40);

}


.timezone-search:focus {

    border-color:
        rgba(255, 209, 102, 0.45);

    box-shadow:
        0 0 0 3px
        rgba(255, 209, 102, 0.06);

}


.timezone-clear {

    position: absolute;

    top: 50%;

    right: 18px;

    transform: translateY(-50%);

    width: 24px;

    height: 24px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 0;

    border-radius: 50%;

    background:
        transparent;

    color:
        rgba(255, 255, 255, 0.50);

    font-size: 18px;

    cursor: pointer;

}


.timezone-clear:hover {

    background:
        rgba(255, 255, 255, 0.10);

    color: #ffffff;

}


/* =====================================================
   OPTIONS
===================================================== */

.timezone-options {

    max-height: 330px;

    overflow-y: auto;

    padding: 6px;

}


/* SCROLLBAR */

.timezone-options::-webkit-scrollbar {

    width: 7px;

}


.timezone-options::-webkit-scrollbar-track {

    background:
        rgba(255, 255, 255, 0.03);

}


.timezone-options::-webkit-scrollbar-thumb {

===================================================== */

.timezone-group {

.timezone-current {

}

<script>

/* =====================================================
   TIMEZONE SELECTOR
===================================================== */

(function () {

    const selector =
        document.getElementById("timezoneSelector");

    const selected =
        document.getElementById("timezoneSelected");

    const dropdown =
        document.getElementById("timezoneDropdown");

    const search =
        document.getElementById("timezoneSearch");

    const clear =
        document.getElementById("timezoneClear");

    const hiddenValue =
        document.getElementById("timezoneValue");

    const selectedText =
        document.getElementById("selectedTimezoneText");

    const options =
        document.querySelectorAll(".timezone-option");

    const groups =
        document.querySelectorAll(".timezone-group");

    const noResults =
        document.getElementById("timezoneNoResults");


    if (
        !selector ||
        !selected ||
        !dropdown ||
        !search ||
        !hiddenValue
    ) {

        return;

    }


    /* ==============================================
       OPEN / CLOSE
    ============================================== */

    function openDropdown() {

        selector.classList.add("open");

        selected.setAttribute(
            "aria-expanded",
            "true"
        );

        setTimeout(function () {

            search.focus();

        }, 50);

    }


    function closeDropdown() {

        selector.classList.remove("open");

        selected.setAttribute(
            "aria-expanded",
            "false"
        );

    }


    selected.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            if (
                selector.classList.contains("open")
            ) {

                closeDropdown();

            } else {

                openDropdown();

            }

        }
    );


    selected.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                if (
                    selector.classList.contains("open")
                ) {

                    closeDropdown();

                } else {

                    openDropdown();

                }

            }

            if (event.key === "Escape") {

                closeDropdown();

            }

        }
    );


    /* ==============================================
       SELECT CURRENT VALUE
    ============================================== */

    function selectTimezone(option) {

        const value =
            option.dataset.value;

        const city =
            option.querySelector(
                ".option-city"
            );

        const zone =
            option.querySelector(
                ".option-zone"
            );


        if (!value) {
            return;
        }


        hiddenValue.value =
            value;


        if (city && zone) {

            selectedText.textContent =
                city.textContent.trim() +
                " — " +
                zone.textContent.trim();

        } else {

            selectedText.textContent =
                value;

        }


        options.forEach(function (item) {

            item.classList.remove(
                "selected"
            );

        });


        option.classList.add(
            "selected"
        );


        search.value = "";

        filterTimezones();

        closeDropdown();

        updateSettingsClock();

    }


    options.forEach(function (option) {

        option.addEventListener(
            "click",
            function () {

                selectTimezone(option);

            }
        );

    });


    /* ==============================================
       SEARCH
    ============================================== */

    function filterTimezones() {

        const query =
            search.value
                .toLowerCase()
                .trim();


        let visibleCount = 0;


        options.forEach(function (option) {

            const searchText =
                (
                    option.dataset.search ||
                    ""
                ).toLowerCase();


            const value =
                (
                    option.dataset.value ||
                    ""
                ).toLowerCase();


            const text =
                (
                    option.textContent ||
                    ""
                ).toLowerCase();


            const matches =
                !query ||
                searchText.includes(query) ||
                value.includes(query) ||
                text.includes(query);


            if (matches) {

                option.style.display =
                    "flex";

                visibleCount++;

            } else {

                option.style.display =
                    "none";

            }

        });


        groups.forEach(function (group) {

            const groupOptions =
                group.querySelectorAll(
                    ".timezone-option"
                );


            let hasVisible =
                false;


            groupOptions.forEach(
                function (option) {

                    if (
                        option.style.display !==
                        "none"
                    ) {

                        hasVisible = true;

                    }

                }
            );


            group.style.display =
                hasVisible
                    ? "block"
                    : "none";

        });


        if (visibleCount === 0) {

            noResults.style.display =
                "block";

        } else {

            noResults.style.display =
                "none";

        }

    }


    search.addEventListener(
        "input",
        filterTimezones
    );


    /* ==============================================
       CLEAR SEARCH
    ============================================== */

    clear.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            event.stopPropagation();

            search.value = "";

            filterTimezones();

            search.focus();

        }
    );


    /* ==============================================
       CLOSE WHEN CLICKING OUTSIDE
    ============================================== */

    document.addEventListener(
        "click",
        function (event) {

            if (
                !selector.contains(event.target)
            ) {

                closeDropdown();

            }

        }
    );


    /* ==============================================
       ESCAPE
    ============================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape"
            ) {

                closeDropdown();

            }

        }
    );


    /* ==============================================
       MARK CURRENT TIMEZONE
    ============================================== */

    const currentTimezone =
        hiddenValue.value;


    options.forEach(function (option) {

        if (
            option.dataset.value ===
            currentTimezone
        ) {

            option.classList.add(
                "selected"
            );

            const city =
                option.querySelector(
                    ".option-city"
                );

            const zone =
                option.querySelector(
                    ".option-zone"
                );


            if (city && zone) {

                selectedText.textContent =
                    city.textContent.trim() +
                    " — " +
                    zone.textContent.trim();

            }

        }

    });


    /* ==============================================
       CURRENT TIME
    ============================================== */

    window.updateSettingsClock =
        function () {

            const clock =
                document.getElementById(
                    "settingsClock"
                );


            if (!clock) {
                return;
            }


            const timezone =
                hiddenValue.value ||
                "Asia/Kolkata";


            try {

                const now =
                    new Date();


                const formatted =
                    new Intl.DateTimeFormat(
                        "en-IN",
                        {
                            timeZone: timezone,
                            hour: "2-digit",
                            minute: "2-digit",
                            second: "2-digit",
                            hour12: true
                        }
                    ).format(now);


                clock.textContent =
                    formatted;

            } catch (error) {

                clock.textContent =
                    new Date().toLocaleTimeString();

            }

        };


    updateSettingsClock();


    setInterval(
        updateSettingsClock,
        1000
    );

})();

/* =====================================================
   MINIMIZE / EXPAND BACKGROUND
===================================================== */

function toggleImages() {

    const grid =
        document.getElementById(
            "backgroundGrid"
        );

    const button =
        document.getElementById(
            "minimizeButton"
        );

    const icon =
        document.getElementById(
            "toggleIcon"
        );

    const text =
        document.getElementById(
            "toggleText"
        );


    if (
        !grid ||
        !button ||
        !icon ||
        !text
    ) {

        return;

    }


    const isMinimized =
        grid.classList.toggle(
            "minimized"
        );


    if (isMinimized) {

        icon.textContent = "+";

        text.textContent = "Expand";

        button.setAttribute(
            "aria-expanded",
            "false"
        );

    }

    else {

        icon.textContent = "−";

        text.textContent = "Minimize";

        button.setAttribute(
            "aria-expanded",
            "true"
        );

    }

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewSelectedImage(input) {

    const preview =
        document.getElementById(
            "uploadPreview"
        );

    const previewImage =
        document.getElementById(
            "previewImage"
        );

    const fileName =
        document.getElementById(
            "selectedFileName"
        );

    const uploadButton =
        document.getElementById(
            "uploadButton"
        );

    const addArea =
        document.getElementById(
            "addImageArea"
        );


    if (
        !preview ||
        !previewImage ||
        !fileName ||
        !uploadButton ||
        !addArea
    ) {

        return;

    }


    if (
        !input.files ||
        !input.files.length
    ) {

        preview.style.display =
            "none";

        addArea.style.display =
            "flex";

        previewImage.src = "";

        fileName.textContent =
            "No image selected";

        fileName.title =
            "No image selected";

        uploadButton.disabled =
            true;

        return;

    }


    const file =
        input.files[0];


    const allowedTypes = [

        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif"

    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        alert(
            "Please select JPG, PNG, WEBP or GIF image."
        );

        input.value = "";

        preview.style.display =
            "none";

        addArea.style.display =
            "flex";

        previewImage.src = "";

        fileName.textContent =
            "No image selected";

        fileName.title =
            "No image selected";

        uploadButton.disabled =
            true;

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function (event) {

            previewImage.src =
                event.target.result;

            preview.style.display =
                "block";

            addArea.style.display =
                "none";

            fileName.textContent =
                file.name;

            fileName.title =
                file.name;

            uploadButton.disabled =
                false;

        };


    reader.readAsDataURL(file);

}


/* =====================================================
   DELETE CONFIRMATION
===================================================== */

function confirmDelete(form) {

    const input =
        form.querySelector(
            'input[name="background"]'
        );


    const filename =
        input
            ? input.value
            : "this image";


    return confirm(
        "Are you sure you want to delete " +
        filename +
        "?"
    );

}

</script>
